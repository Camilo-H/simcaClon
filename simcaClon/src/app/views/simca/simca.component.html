<div class="simca-container">

  <!-- Elementos decorativos -->
  <img src="../../../assets/antorcha.png" alt="" class="antorcha" />
  <img src="../../../assets/bandera.png" alt="" class="bandera" />

  <!-- Header -->
  <header class="simca-header">
    <a
      href="http://www.unicauca.edu.co"
      id="logoU"
      aria-label="Universidad del Cauca">
    </a>

    <span class="separador"></span>

    <p id="desc">
      Sistema Integrado de Matrícula y<br />
      Control Académico
    </p>
  </header>

  <!-- Login -->
  <main class="simca-login">

    <div class="login-background">

      <img
        src="../../../assets/logo-simca.png"
        alt="Logo SIMCA"
        class="logo-simca"
      />

      <h2 class="login-title">
        Iniciar Sesión
      </h2>

      <form class="login-form">

        <div class="input-group">
          <span class="icon user-icon"></span>

          <input
            type="text"
            placeholder="Usuario"
            aria-label="Usuario"
          />
        </div>

        <div class="input-group">
          <span class="icon key-icon"></span>

          <input
            type="password"
            placeholder="Contraseña"
            aria-label="Contraseña"
          />
        </div>

        <button
          type="submit"
          class="btn-ingresar">
          Ingresar
        </button>

      </form>

    </div>

  </main>

  <!-- Footer -->
  <footer class="simca-footer">

    <div class="footer-text">
      <p>
        2026 | División de Tecnologías de la Información y las Comunicaciones
      </p>

      <p>
        Universidad del Cauca |
        <a href="mailto:simca@unicauca.edu.co">
          simca@unicauca.edu.co
        </a>
      </p>

      <p>
        Versión: v2.6.44
      </p>
    </div>

  </footer>

</div>
